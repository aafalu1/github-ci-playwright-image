# ==============================================================================
# GitLab CI/CD Pipeline
# Build, Verify and Publish Playwright + Behave Container Image
# ==============================================================================

stages:
  - build
  - test
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  PYTHON_VERSION: "3.11"

  IMAGE_TAG_BRANCH: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  IMAGE_TAG_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_TAG_LATEST: "$CI_REGISTRY_IMAGE:latest"
  IMAGE_TAG_PYTHON: "$CI_REGISTRY_IMAGE:py3.11"

default:
  image: docker:24.0.5

  services:
    - name: docker:24.0.5-dind

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# ==============================================================================
# Build Container Image
# ==============================================================================

build:docker_image:
  stage: build

  interruptible: true

  retry:
    max: 2

  script:
    - echo "Pulling previous image for Docker layer caching..."
    - docker pull "$IMAGE_TAG_LATEST" || true

    - echo "Building Playwright CI image..."

    - |
      docker build \
        --build-arg PYTHON_VERSION=$PYTHON_VERSION \
        --cache-from "$IMAGE_TAG_LATEST" \
        --tag "$IMAGE_TAG_BRANCH" \
        --tag "$IMAGE_TAG_SHA" \
        --file Dockerfile \
        .

    - echo "Pushing commit images..."

    - docker push "$IMAGE_TAG_BRANCH"
    - docker push "$IMAGE_TAG_SHA"

    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then

        echo "Publishing latest tags..."

        docker tag "$IMAGE_TAG_BRANCH" "$IMAGE_TAG_LATEST"
        docker tag "$IMAGE_TAG_BRANCH" "$IMAGE_TAG_PYTHON"

        docker push "$IMAGE_TAG_LATEST"
        docker push "$IMAGE_TAG_PYTHON"

      fi

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ==============================================================================
# Verify Image
# Runs inside the newly built image
# ==============================================================================

test:verify_image:
  stage: test

  image: "$IMAGE_TAG_SHA"

  services: []

  before_script: []

  script:
    - echo "Running image verification..."

    - python --version
    - playwright --version
    - behave --version

    - /usr/local/bin/scripts/verify_image.sh

  needs:
    - build:docker_image

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ==============================================================================
# Publish Release Tag
# Triggered by Git tag (v1.0.0, v2.1.0, etc.)
# ==============================================================================

release:tag_image:
  stage: release

  retry:
    max: 2

  script:
    - echo "Creating release image tag..."

    - docker pull "$IMAGE_TAG_SHA"

    - docker tag "$IMAGE_TAG_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

    - echo "Published $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

  needs:
    - build:docker_image
    - test:verify_image

  rules:
    - if: '$CI_COMMIT_TAG'