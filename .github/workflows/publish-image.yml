name: Build and publish Playwright image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$repository" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image locally
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker buildx build \
            --load \
            --build-arg PYTHON_VERSION=3.11 \
            --tag "$IMAGE_NAME:ci" \
            .

      - name: Verify Python dependencies and Chromium
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: docker run --rm "$IMAGE_NAME:ci" /usr/local/bin/scripts/verify_image.sh

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker tag "$IMAGE_NAME:ci" "$image_tag"
            docker push "$image_tag"
          done <<< "$TAGS"
